# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-export-prometheus-plugin"
version = "1.5.0"
publish = false            # first-party signed cdylib, shipped as a packed/signed tarball, not to crates.io
edition = "2021"
rust-version = "1.97"
description = "First-party signed kind:export plugin cdylib: the prometheus export sink (`module: prometheus`), packaged as a droppable busbar plugin. Drop the signed tarball into `plugins/` and name it from an `export.<name>.module: prometheus` block."
license = "Apache-2.0"

[lib]
# cdylib: the DROPPED-IN door (a signed tarball in `plugins/`). rlib: REQUIRED for `cargo test` to
# emit the cdylib artifact the conformance test packs (a cdylib-only package builds a trivial test
# harness and never produces the .so/.dylib — the store-postgres-plugin / store-mysql-plugin note).
crate-type = ["cdylib", "rlib"]

[dependencies]
# THE LOGIC, same repo. Its `export_export_plugin!(open)` registers the image's one door; this crate
# only makes that door a loadable library.
busbar-export-prometheus = { path = "../export-prometheus" }

[dev-dependencies]
# The conformance test loads the built cdylib over the REAL loader (sign, pack, scan, open) and the
# linked row through the same registry — dev-only, never in the shipped artifact. Same pinned rev as
# the logic crate's busbar-contract, so one busbar source resolves.
busbar-plugin-loader = { git = "https://github.com/GetBusbar/busbar", rev = "23d8a6b46deb158839df8bc02115b09023633040" }
busbar-contract = { git = "https://github.com/GetBusbar/busbar", rev = "23d8a6b46deb158839df8bc02115b09023633040" }
serde_json = "1"
